# Netlify configuration for mizmormusic.com
#
# The site itself is a Next.js static export (see next.config.mjs), published
# from `out`. The contact form needs to send mail, which cannot be done from
# the browser without exposing the mailbox password — so a single serverless
# function handles it, deployed alongside the static files.

[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
